name: mybrain-cn
version: 0.1.1
description: Public, user-data-free Hermes profile for the @MyBrain personal professional brain.
hermes_requires: ">=0.20.0"
license: MIT
env_requires:
  - name: MYBRAIN_GBRAIN_CLI
    description: Absolute path to the installed GBrain src/cli.ts entrypoint.
    required: true
  - name: MYBRAIN_GBRAIN_HOME
    description: Absolute path to the private GBrain state root selected during onboarding.
    required: true
  - name: MYBRAIN_SOURCE_ID
    description: Personal GBrain source ID selected during onboarding.
    required: true
distribution_owned:
  - distribution.yaml
  - SOUL.md
  - config.yaml
  - mcp.json
  - skills/
  - README.md
  - .gitignore
